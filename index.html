<title>Hábitos de Alexis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: paper-and-ink app — cream page, outlined cards, one orange accent. Bottom tab bar on phone, left rail on desktop. */
:root{
  --bg:#efe8dd; --card:#f6f1e8; --ink:#211a14; --muted:#857869; --rule:#2a221b; --faint:#dcd3c6; --hair:#cdc2b3;
  --accent:#de5d24; --accent-ink:#fff8f1;
  --f:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17120f; --card:#201a16; --ink:#f1e8dc; --muted:#a69786; --rule:#d9cdbf; --faint:#3a302a; --hair:#4a3f37;
  --accent:#f07a42; --accent-ink:#1a0e07; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120f; --card:#201a16; --ink:#f1e8dc; --muted:#a69786; --rule:#d9cdbf; --faint:#3a302a; --hair:#4a3f37;
  --accent:#f07a42; --accent-ink:#1a0e07; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 100px;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{max-width:1120px;margin:0 auto}
@media (min-width:900px){
  body{padding-bottom:40px}
  .shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px}
}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1.5px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{padding:10px 2px 12px;font-size:11px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:62px}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
.brand{display:none}
@media (min-width:900px){
  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:4px;border:0;padding-top:28px;background:none}
  .brand{display:block;font-weight:800;font-size:15px;margin:0 0 18px 12px;letter-spacing:-.01em}
  .brand i{font-style:normal;color:var(--accent)}
  nav.tabs button{flex-direction:row;justify-content:flex-start;min-height:0;padding:10px 12px;border-radius:12px;font-size:15px;gap:12px}
  nav.tabs button[aria-selected="true"]{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--rule)}
}

/* page header */
header.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:22px 18px}
header.ph h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1}
.sync{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:#4caf7d}.dot.err{background:#d64545}
.sq{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--rule);display:grid;place-items:center;flex:none;background:var(--card)}
.sq svg{width:20px;height:20px}
.sq:disabled{opacity:.3;cursor:default}

section[hidden]{display:none}
.card{background:var(--card);border:1.5px solid var(--rule);border-radius:var(--r);min-width:0}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.muted{color:var(--muted)}
.stack{display:grid;gap:10px}
.sec-title{margin:26px 0 12px}

/* steppers */
.nav-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-row .mid{flex:1;text-align:center;min-width:0;font-weight:700;font-size:15px}
.nav-row .mid small{display:block;font-weight:500;color:var(--accent);font-size:12px;margin-top:2px}
.nav-row .mid small button{color:inherit;font-weight:600}
.dayname{font-weight:700;font-size:15px}

/* Hoy */
.hoy-grid{display:grid;gap:22px}
@media (min-width:1000px){.hoy-grid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}.hoy-grid .sec-title.first{margin-top:0}}
.summary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 16px 14px}
.summary b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.summary p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.ring{width:60px;height:60px;position:relative}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:13px}
.pbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--faint);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;transition:background .15s}
.chk svg{width:16px;height:16px;opacity:0;color:var(--accent-ink)}
.done .chk{background:var(--accent);border-color:var(--accent)}
.done .chk svg{opacity:1}
.chk-hit{padding:7px;margin:-7px}
.htxt{text-align:left;min-width:0}
.htxt b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.htxt small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.flame{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;white-space:nowrap}
.flame svg{width:12px;height:14px;color:var(--accent)}
.hours-panel{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px dashed var(--hair)}
.hours-panel input{width:76px;height:40px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);text-align:center;font-weight:600}
.chip{height:36px;padding:0 12px;border-radius:99px;border:1.5px solid var(--hair);font-size:13px;font-weight:600}
.chip:hover{border-color:var(--rule)}
.dashed{width:100%;min-height:52px;border:1.5px dashed var(--rule);border-radius:var(--r);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.lastday{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 4px;text-align:left;width:100%;border-bottom:1px solid var(--hair)}
.lastday:last-child{border-bottom:0}
.lastday small{display:block;color:var(--muted);font-size:12px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:120px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.dots i.on{background:var(--accent)}
.empty{border:1.5px dashed var(--hair);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* Hábitos */
.hab-grid{display:grid;gap:12px}
@media (min-width:760px){.hab-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hcard{padding:14px 14px 12px}
.hcard .top{display:flex;align-items:flex-start;gap:10px}
.hcard .top .t{flex:1;min-width:0;text-align:left}
.hcard .top .t b{display:block;font-weight:700;font-size:16px;overflow-wrap:anywhere}
.hcard .top .t small{color:var(--muted);font-size:12px}
.hcard .acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.icon{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.icon:hover{color:var(--ink)}
.icon svg{width:16px;height:16px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) auto;align-items:end;gap:4px;margin-top:12px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--muted)}
.week .d.today{color:var(--ink);font-weight:800}
.wdot{width:26px;height:26px;border-radius:50%;background:var(--faint);display:grid;place-items:center}
.wdot.on{background:var(--accent)}
.wdot.pend{background:none;border:1.5px solid var(--rule)}
.wdot.fut{background:none;border:1.5px dashed var(--hair);cursor:default}
.wdot.na{background:none;cursor:default}
.wdot.na::after{content:"";width:8px;height:1.5px;background:var(--hair)}
.week .cnt{font-size:12px;color:var(--muted);padding:0 0 6px 6px;white-space:nowrap}
.confirm{display:flex;gap:6px;align-items:center;font-size:12px}
.mini{height:32px;padding:0 10px;border-radius:8px;border:1.5px solid var(--rule);font-size:12px;font-weight:700}
.mini.warn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
form.hf{display:grid;gap:14px;padding:16px}
.field label,.field .label{display:block;margin-bottom:6px}
.field input{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--rule);background:var(--bg);padding:0 14px;font-size:16px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{height:44px;border-radius:50%;max-width:44px;width:100%;justify-self:center;border:1.5px solid var(--rule);font-weight:700;font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--rule);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.err{color:#d64545;font-size:13px;min-height:1em}
.backup{padding:16px;margin-top:22px}
.backup p{margin:6px 0 12px;color:var(--muted);font-size:13px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{padding:14px}
.kpi .v{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:12px}
.kpi .v small{font-size:13px;font-weight:600;letter-spacing:0;margin-left:2px}
.kpi .label{display:flex;align-items:center;gap:5px}
.kpi .label svg{width:10px;height:12px;color:var(--accent)}

/* Racha heatmap */
.year{padding:16px;margin-top:12px}
.year .yh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.year .yh b{font-size:18px;font-weight:800}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px}
@media (min-width:560px){.months{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){.months{grid-template-columns:repeat(6,minmax(0,1fr))}}
.month small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.mgrid{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;max-width:150px}
.mgrid i,.mgrid button{aspect-ratio:1;border-radius:2px;background:var(--faint);display:block;width:100%;max-width:100%}
.mgrid i{opacity:.45}
.mgrid i.blank{background:none}
.mgrid .fut{opacity:.25}
.l1{background:color-mix(in srgb,var(--accent) 28%,var(--faint))}
.l2{background:color-mix(in srgb,var(--accent) 52%,var(--faint))}
.l3{background:color-mix(in srgb,var(--accent) 76%,var(--faint))}
.l4{background:var(--accent)}
.mgrid .tdy{opacity:1;box-shadow:0 0 0 1.5px var(--rule)}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--muted);margin-top:12px}
.legend i{width:11px;height:11px;border-radius:2px;display:block}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px}
.srow b{font-weight:600;overflow-wrap:anywhere}
.srow span{font-size:13px;color:var(--muted);white-space:nowrap}

/* Estadísticas */
.stat-grid{display:grid;gap:12px}
@media (min-width:760px){.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scard{padding:16px}
.scard h3{margin:0;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.scard .sub{font-size:12px;color:var(--muted);margin:2px 0 14px}
.scard.global{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scard.global .sub,.scard.global .k{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:420px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sgrid .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sgrid .v small{font-size:12px;font-weight:600}
.sgrid .k{font-size:11px;color:var(--muted)}
.pcts{display:grid;gap:7px;margin-top:14px}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) 42px;align-items:center;gap:8px;font-size:12px}
.prow .bar{height:8px;border-radius:99px;background:var(--faint);overflow:hidden}
.scard.global .prow .bar{background:color-mix(in srgb,var(--bg) 22%,var(--ink))}
.prow .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prow .n{text-align:right;font-weight:700}

/* Resumen */
.rank{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 14px}
.rank b{font-weight:500;overflow-wrap:anywhere}
.rank span{color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}

.banner{border:1.5px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
<nav class="tabs" role="tablist" aria-label="Secciones">
  <div class="brand">Hábitos<i>.</i></div>
  <button role="tab" data-tab="hoy" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Hoy</button>
  <button role="tab" data-tab="habitos" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Hábitos</button>
  <button role="tab" data-tab="racha" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2-4.5.3 1.5 1 2.5 2 3 0-3 .5-6 1-8.5Z"/></svg>Racha</button>
  <button role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 20v-6M12 20V5M18 20v-9M3 20h18"/></svg>Estadísticas</button>
  <button role="tab" data-tab="resumen" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Resumen</button>
</nav>

<main>
  <header class="ph">
    <div><h1 id="pTitle">Hoy</h1><div class="sync" id="sync"><i class="dot"></i><span>Conectando…</span></div></div>
    <button class="sq" id="themeBtn" aria-label="Cambiar tema claro u oscuro"></button>
  </header>
  <div class="banner" id="banner" hidden></div>

  <section id="tab-hoy">
    <div class="nav-row">
      <button class="sq" id="dPrev" aria-label="Día anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="mid"><span id="dTitle"></span><small id="dSub"></small></div>
      <button class="sq" id="dNext" aria-label="Día siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="hoy-grid">
      <div class="stack" id="hoyMain"></div>
      <div><div class="label sec-title first">Últimos días</div><div class="card" style="padding:4px 12px" id="lastDays"></div></div>
    </div>
  </section>

  <section id="tab-habitos" hidden>
    <div class="nav-row">
      <button class="sq" id="wPrev" aria-label="Semana anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="mid"><span id="wTitle"></span><small id="wSub"></small></div>
      <button class="sq" id="wNext" aria-label="Semana siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div id="formBox" style="margin-bottom:12px"></div>
    <div class="hab-grid" id="habGrid"></div>
    <div class="card backup">
      <div class="label">Copia de seguridad</div>
      <p>Exporta tus hábitos y registros a un archivo JSON o restaura uno anterior. Importar reemplaza los datos actuales.</p>
      <div class="btns"><button class="btn" id="bExport">Exportar JSON</button><button class="btn" id="bImport">Importar JSON</button></div>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
      <div class="confirm" id="impConfirm" hidden style="margin-top:12px;flex-wrap:wrap"></div>
    </div>
  </section>

  <section id="tab-racha" hidden>
    <div class="kpis" id="rKpis"></div>
    <div class="card year">
      <div class="yh">
        <button class="sq" id="yPrev" aria-label="Año anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <div style="flex:1"><b id="yTitle"></b> <span class="muted" id="ySub" style="font-size:13px;margin-left:6px"></span></div>
        <button class="sq" id="yNext" aria-label="Año siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div class="months" id="months"></div>
      <div class="legend">Menos <i style="background:var(--faint)"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> Más</div>
    </div>
    <div class="label sec-title">Racha por hábito</div>
    <div class="stack" id="rList"></div>
  </section>

  <section id="tab-stats" hidden>
    <div class="stat-grid" id="statGrid"></div>
  </section>

  <section id="tab-resumen" hidden>
    <div class="nav-row">
      <button class="sq" id="mPrev" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="mid" id="mTitle"></div>
      <button class="sq" id="mNext" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="kpis three" id="mKpis"></div>
    <div class="label sec-title">Lo que más cumpliste</div>
    <div class="stack" id="mRank"></div>
  </section>
</main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== STATS (pure) ===== */
const DAYS=["L","M","X","J","V","S","D"];
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const dow=s=>(parse(s).getDay()+6)%7; // 0 = lunes
const weekStart=s=>addDays(s,-dow(s));
const applies=(h,s)=>h.days.includes(dow(s));
const entry=(logs,s,id)=>(logs[s]&&logs[s][id])||null;
const isDone=(logs,s,id)=>!!(entry(logs,s,id)&&entry(logs,s,id).done);
const hoursOf=(logs,s,id)=>{const e=entry(logs,s,id);return e&&+e.hours>0?+e.hours:0};

// Primer día que cuenta para un hábito: su fecha de inicio o el registro más antiguo.
function habitStart(h,logs){
  let s=h.start;
  for(const d in logs){ if(logs[d][h.id] && d<s) s=d; }
  return s;
}
// Último día evaluable: hoy cuenta solo si ya está hecho (para no penalizar el día en curso).
function countable(h,logs,s,today){ return s<today || (s===today && isDone(logs,s,h.id)); }

function habitStats(h,logs,today){
  const start=habitStart(h,logs);
  const ws=weekStart(today), ms=today.slice(0,8)+"01";
  let applicable=0,done=0,hours=0,run=0,best=0;
  const per={week:[0,0],month:[0,0],total:[0,0]};
  for(let s=start;s<=today;s=addDays(s,1)){
    hours+=hoursOf(logs,s,h.id);
    if(!applies(h,s)||!countable(h,logs,s,today)) continue;
    const ok=isDone(logs,s,h.id);
    applicable++; if(ok) done++;
    run=ok?run+1:0; if(run>best) best=run;
    per.total[1]++; if(ok) per.total[0]++;
    if(s>=ws){per.week[1]++; if(ok) per.week[0]++;}
    if(s>=ms){per.month[1]++; if(ok) per.month[0]++;}
  }
  // racha actual: hacia atrás desde hoy; hoy sin hacer no rompe la racha
  let cur=0;
  for(let s=today;s>=start;s=addDays(s,-1)){
    if(!applies(h,s)) continue;
    if(isDone(logs,s,h.id)) cur++;
    else if(s===today) continue;
    else break;
  }
  const pct=p=>p[1]?p[0]/p[1]:null;
  return {current:cur,best,done,applicable,hours,week:pct(per.week),month:pct(per.month),total:pct(per.total),start};
}

// Global: un día cuenta si tiene hábitos aplicables; está cumplido si se hicieron todos.
function globalStats(habits,logs,today){
  if(!habits.length) return {current:0,best:0,done:0,applicable:0,hours:0,week:null,month:null,total:null,perfect:0,days:0};
  const starts=habits.map(h=>habitStart(h,logs)); const start=starts.reduce((a,b)=>a<b?a:b);
  const ws=weekStart(today), ms=today.slice(0,8)+"01";
  let done=0,applicable=0,hours=0,run=0,best=0,perfect=0,days=0;
  const per={week:[0,0],month:[0,0],total:[0,0]};
  const dayInfo=s=>{let a=0,d=0;habits.forEach((h,i)=>{if(s>=starts[i]&&applies(h,s)){a++;if(isDone(logs,s,h.id))d++;}});return [d,a]};
  for(let s=start;s<=today;s=addDays(s,1)){
    habits.forEach(h=>hours+=hoursOf(logs,s,h.id));
    let [d,a]=dayInfo(s);
    if(!a) continue;
    if(s===today && d<a){ // día en curso: solo suma lo hecho
      done+=d; applicable+=d; per.total[0]+=d;per.total[1]+=d;per.week[0]+=d;per.week[1]+=d;per.month[0]+=d;per.month[1]+=d; continue; }
    done+=d; applicable+=a; days++;
    per.total[0]+=d;per.total[1]+=a;
    if(s>=ws){per.week[0]+=d;per.week[1]+=a;}
    if(s>=ms){per.month[0]+=d;per.month[1]+=a;}
    const full=d===a; if(full) perfect++;
    run=full?run+1:0; if(run>best) best=run;
  }
  let cur=0;
  for(let s=today;s>=start;s=addDays(s,-1)){
    const [d,a]=dayInfo(s); if(!a) continue;
    if(d===a) cur++; else if(s===today) continue; else break;
  }
  const pct=p=>p[1]?p[0]/p[1]:null;
  return {current:cur,best,done,applicable,hours,week:pct(per.week),month:pct(per.month),total:pct(per.total),perfect,days};
}
/* ===== END STATS ===== */
</script>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const MO=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const todayStr=()=>fmt(new Date());
const fmtH=h=>String(Math.round(h*100)/100).replace(".",",");
const pctTxt=p=>p==null?"—":Math.round(p*100)+"%";
const dd=n=>n===1?"día":"días";
const dayLabel=s=>cap(WD[dow(s)])+" "+parse(s).getDate()+" de "+MO[parse(s).getMonth()];
const daysTxt=d=>d.length===7?"Todos los días":d.join()==="0,1,2,3,4"?"De lunes a viernes":d.join()==="5,6"?"Fin de semana":d.map(i=>DAYS[i]).join(" · ");
const FLAME='<svg viewBox="0 0 12 14" fill="currentColor"><path d="M6 0c.6 2.4 4.5 4 4.5 8A4.5 4.5 0 0 1 1.5 8c0-1.8.8-3 1.7-3.8.3 1.2.9 2 1.8 2.4C5 4.4 5.4 2 6 0Z"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 5l5 5M4 20l1-5L15.5 4.5a2 2 0 0 1 3 0l1 1a2 2 0 0 1 0 3L9 19Z"/></svg>';
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>';

let db=null, habits=[], logs={}, loaded=false;
let tab="hoy", day=todayStr(), wk=weekStart(todayStr()), ym=todayStr().slice(0,7), yr=+todayStr().slice(0,4);
let editing=null, formOpen=false, fDays=[0,1,2,3,4,5,6], expanded=null, confirmDel=null;

/* --- tema (preferencia por dispositivo) --- */
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function paintTheme(){$("#themeBtn").innerHTML=isDark()?SUN:MOON}
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(_){}
$("#themeBtn").onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("theme",t)}catch(_){}paintTheme()};
paintTheme();

/* --- escrituras: una a la vez por documento --- */
const chains={}, docExists={};
function write(path,fn){const p=(chains[path]||Promise.resolve()).then(fn).catch(e=>{console.error(e);toast("No se pudo guardar. Revisa la conexión.");setSync("err")});chains[path]=p;return p}
function setEntry(date,id,patch){
  const cur=Object.assign({done:false,hours:0},entry(logs,date,id),patch);
  const existed=!!logs[date]||docExists["logs/"+date];
  logs[date]=Object.assign({},logs[date],{[id]:cur});
  safeRender();
  if(!db) return;
  write("logs/"+date,()=>existed||docExists["logs/"+date]
    ? db.doc("logs/"+date).update({entries:{[id]:cur}})
    : db.doc("logs/"+date).set({date,entries:logs[date]}).then(()=>{docExists["logs/"+date]=true}));
}

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
function setSync(s){const el=$("#sync");el.querySelector(".dot").className="dot "+(s==="ok"?"ok":s==="err"?"err":"");
  el.querySelector("span").textContent=s==="ok"?"Sincronizado":s==="err"?"Error al guardar":s==="local"?"Sin sincronizar":"Conectando…"}

/* --- helpers de datos --- */
const habitsFor=s=>habits.filter(h=>applies(h,s));
let starts={};
function dayInfo(s){let a=0,d=0,miss=[];habits.forEach(h=>{if(s>=starts[h.id]&&applies(h,s)){a++;if(isDone(logs,s,h.id))d++;else miss.push(h.name)}});return {a,d,miss}}
function rangeStats(h,from,to,today){
  let a=0,d=0,hrs=0;const st=starts[h.id];
  for(let s=from<st?st:from;s<=to&&s<=today;s=addDays(s,1)){
    hrs+=hoursOf(logs,s,h.id);
    if(applies(h,s)&&countable(h,logs,s,today)){a++;if(isDone(logs,s,h.id))d++}
  }
  return {a,d,hrs};
}
const earliest=()=>Object.values(starts).reduce((a,b)=>a<b?a:b,todayStr());

function render(){
  const today=todayStr();
  starts={};habits.forEach(h=>starts[h.id]=habitStart(h,logs));
  $("#pTitle").textContent={hoy:"Hoy",habitos:"Hábitos",racha:"Racha",stats:"Estadísticas",resumen:"Resumen"}[tab];
  ({hoy:renderHoy,habitos:renderHabitos,racha:renderRacha,stats:renderStats,resumen:renderResumen})[tab](today);
}
function safeRender(){const a=document.activeElement;if(a&&a.dataset&&a.dataset.hours!=null){a.addEventListener("blur",()=>render(),{once:true});return}render()}

/* --- Hoy --- */
function renderHoy(today){
  const y=addDays(today,-1);
  $("#dTitle").textContent=dayLabel(day);
  $("#dSub").innerHTML=day===today?"Hoy":day===y?'Ayer · <button data-goday="'+today+'">volver a hoy</button>':'<button data-goday="'+today+'">Volver a hoy</button>';
  $("#dNext").disabled=day>=today;
  const M=$("#hoyMain");
  if(!loaded){M.innerHTML='<div class="empty">Cargando tus hábitos…</div>';$("#lastDays").innerHTML="";return}
  if(!habits.length){
    M.innerHTML='<div class="empty"><b>Empieza con tu primer hábito</b>Ponle nombre, elige los días y, si quieres, un objetivo de horas.</div><button class="dashed" data-newhabit>+ Nuevo hábito</button>';
    $("#lastDays").innerHTML='<p class="muted" style="font-size:13px;margin:10px 0">Aquí verás los 7 días anteriores con un punto por hábito.</p>';return}
  const hs=habitsFor(day), dn=hs.filter(h=>isDone(logs,day,h.id)).length, G=globalStats(habits,logs,today);
  let hint;
  if(!hs.length) hint="Ningún hábito aplica este "+WD[dow(day)]+".";
  else if(dn===hs.length) hint=day===today?"Día perfecto. Llevas "+G.current+" "+dd(G.current)+" de racha.":"Día perfecto.";
  else if(day===today){const left=hs.length-dn;hint="Marca "+left+" más y sumas el día "+(G.current+1)+" de racha."}
  else hint="Faltaron "+(hs.length-dn)+". Puedes marcarlos ahora.";
  const p=hs.length?dn/hs.length:0, C=2*Math.PI*26;
  let html=`<div class="card summary"><div><b>${dn} de ${hs.length} hechos</b><p>${hint}</p></div>
    <div class="ring" aria-hidden="true"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="var(--faint)" stroke-width="5"/><circle cx="30" cy="30" r="26" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="transition:stroke-dashoffset .35s"/></svg><span>${dn}/${hs.length}</span></div>
    <div class="pbar"><i style="width:${p*100}%"></i></div></div>`;
  html+=hs.map(h=>{
    const done=isDone(logs,day,h.id), hr=hoursOf(logs,day,h.id), st=habitStats(h,logs,today), open=expanded===h.id;
    let sub=done?"Hecho":"Pendiente";
    if(h.target) sub+=" · "+fmtH(hr)+" de "+fmtH(h.target)+" h"; else if(hr) sub+=" · "+fmtH(hr)+" h";
    sub+=open?"":" · anotar horas";
    return `<div class="card hrow${done?" done":""}">
      <button class="chk-hit" data-toggle="${h.id}" aria-pressed="${done}" aria-label="Marcar ${esc(h.name)}"><span class="chk">${CHECK}</span></button>
      <button class="htxt" data-expand="${h.id}" aria-expanded="${open}"><b>${esc(h.name)}</b><small>${sub}</small></button>
      <span class="flame">${FLAME}${st.current} ${dd(st.current)}</span>
      ${open?`<div class="hours-panel"><label class="muted" for="hrs-${h.id}" style="font-size:13px">Horas</label>
        <input id="hrs-${h.id}" data-hours="${h.id}" type="number" inputmode="decimal" min="0" max="24" step="0.25" value="${hr||""}" placeholder="0">
        <button class="chip" data-add="${h.id}" data-v="0.25">+15 min</button><button class="chip" data-add="${h.id}" data-v="0.5">+30 min</button><button class="chip" data-add="${h.id}" data-v="1">+1 h</button>${hr?`<button class="chip" data-add="${h.id}" data-v="0">Borrar</button>`:""}</div>`:""}
    </div>`}).join("");
  const off=habits.filter(h=>!applies(h,day));
  if(off.length&&hs.length) html+=`<p class="muted" style="font-size:12px;margin:2px 4px">No aplican este día: ${off.map(h=>esc(h.name)).join(", ")}</p>`;
  html+='<button class="dashed" data-newhabit>+ Nuevo hábito</button>';
  M.innerHTML=html;
  // últimos días
  const first=earliest(); let ld="";
  for(let i=1;i<=7;i++){const s=addDays(day,-i); if(s<first) break;
    const {a,d,miss}=dayInfo(s); if(!a) continue;
    const note=d===a?"día perfecto":miss.length<=2?"faltó "+miss.join(" y "):"faltaron "+miss.length;
    const dots=habits.filter(h=>s>=starts[h.id]&&applies(h,s)).map(h=>`<i class="${isDone(logs,s,h.id)?"on":""}"></i>`).join("");
    ld+=`<button class="lastday" data-goday="${s}"><span><span class="dayname">${cap(WD[dow(s)])} ${parse(s).getDate()}</span><small>${d} de ${a} · ${esc(note)}</small></span><span class="dots">${dots}</span></button>`}
  $("#lastDays").innerHTML=ld||'<p class="muted" style="font-size:13px;margin:10px 0">Todavía no hay días anteriores registrados.</p>';
}

/* --- Hábitos --- */
function renderHabitos(today){
  const end=addDays(wk,6),a=parse(wk),b=parse(end);
  $("#wTitle").textContent=a.getDate()+(a.getMonth()!==b.getMonth()?" "+MO[a.getMonth()].slice(0,3):"")+" – "+b.getDate()+" "+MO[b.getMonth()].slice(0,3)+(b.getFullYear()!==+today.slice(0,4)?" "+b.getFullYear():"");
  $("#wSub").innerHTML=wk===weekStart(today)?"Esta semana":'<button data-gowk>Volver a esta semana</button>';
  $("#wNext").disabled=end>=today;
  renderForm();
  const g=$("#habGrid");
  if(!loaded){g.innerHTML='<div class="empty">Cargando…</div>';return}
  if(!habits.length){g.innerHTML="";return}
  const ds=[...Array(7)].map((_,i)=>addDays(wk,i));
  g.innerHTML=habits.map(h=>{
    const st=habitStats(h,logs,today); let A=0,D=0;
    const cells=ds.map((d,i)=>{
      const lab=`<span>${DAYS[i]}</span>`, cls=d===today?"d today":"d";
      if(!applies(h,d)||d<starts[h.id]&&!entry(logs,d,h.id)) return `<div class="${cls}">${lab}<span class="wdot na"></span></div>`;
      const done=isDone(logs,d,h.id);
      if(d>today) return `<div class="${cls}">${lab}<span class="wdot fut"></span></div>`;
      if(d<today||done){A++;if(done)D++}
      return `<div class="${cls}">${lab}<button class="wdot ${done?"on":d===today?"pend":""}" data-wtoggle="${h.id}" data-date="${d}" aria-pressed="${done}" aria-label="${esc(h.name)}, ${dayLabel(d)}"></button></div>`}).join("");
    const meta=daysTxt(h.days)+(h.target?" · "+fmtH(h.target)+" h/día":"");
    return `<div class="card hcard"><div class="top">
      <div class="t"><b>${esc(h.name)}</b><small>${meta}</small></div>
      <div class="acts">${confirmDel===h.id?`<div class="confirm"><button class="mini warn" data-delok="${h.id}">Borrar</button><button class="mini" data-delno>No</button></div>`:
        `<div style="display:flex"><button class="icon" data-edit="${h.id}" aria-label="Editar ${esc(h.name)}">${PEN}</button><button class="icon" data-del="${h.id}" aria-label="Borrar ${esc(h.name)}">${TRASH}</button></div>`}
        <span class="flame">${FLAME}${st.current} ${dd(st.current)}</span></div></div>
      <div class="week">${cells}<span class="cnt">${D} de ${A}</span></div></div>`}).join("");
}
function renderForm(){
  const box=$("#formBox");
  if(!formOpen){box.innerHTML='<button class="dashed" data-newhabit>+ Nuevo hábito</button>'+(loaded&&!habits.length?'<div class="empty" style="margin-top:12px"><b>Aún no tienes hábitos</b>Crea el primero: nombre, días de la semana y objetivo de horas opcional.</div>':"");return}
  if(box.querySelector("form")){box.querySelectorAll(".days button").forEach(b=>b.setAttribute("aria-pressed",fDays.includes(+b.dataset.day)));return}
  const h=editing?habits.find(x=>x.id===editing):null;
  box.innerHTML=`<form class="card hf" id="hForm" autocomplete="off">
    <div class="label">${h?"Editar hábito":"Nuevo hábito"}</div>
    <div class="field"><label class="muted" for="fName" style="font-size:13px">Nombre</label><input id="fName" maxlength="60" placeholder="Ej. Leer 20 min" value="${h?esc(h.name):""}"></div>
    <div class="field"><span class="muted" style="font-size:13px;display:block;margin-bottom:6px">Días</span>
      <div class="days">${DAYS.map((d,i)=>`<button type="button" data-day="${i}" aria-pressed="${fDays.includes(i)}" aria-label="${WD[i]}">${d}</button>`).join("")}</div>
      <div class="quick"><button type="button" class="chip" data-q="all">Todos</button><button type="button" class="chip" data-q="wk">L–V</button><button type="button" class="chip" data-q="we">Fin de semana</button></div></div>
    <div class="field"><label class="muted" for="fTarget" style="font-size:13px">Objetivo de horas al día (opcional)</label><input id="fTarget" type="number" min="0" max="24" step="0.25" inputmode="decimal" placeholder="Sin objetivo" value="${h&&h.target?h.target:""}"></div>
    <div class="err" id="fErr"></div>
    <div class="btns"><button class="btn primary" type="submit">${h?"Guardar cambios":"Añadir hábito"}</button><button class="btn" type="button" data-cancel>Cancelar</button></div>
    ${h?`<button type="button" class="btn" data-formdel="${h.id}" style="color:#d64545;border-color:#d64545">Borrar hábito</button>`:""}</form>`;
  $("#fName").focus();
}

/* --- Racha --- */
function renderRacha(today){
  const G=globalStats(habits,logs,today);
  $("#rKpis").innerHTML=`<div class="card kpi"><div class="label">${FLAME}Racha actual</div><div class="v">${G.current}<small>${dd(G.current)}</small></div></div>
    <div class="card kpi"><div class="label">Mejor racha</div><div class="v">${G.best}<small>${dd(G.best)}</small></div></div>`;
  $("#yTitle").textContent=yr; $("#yNext").disabled=yr>=+today.slice(0,4);
  let perfect=0, html="";
  for(let m=0;m<12;m++){
    const first=yr+"-"+pad(m+1)+"-01", n=new Date(yr,m+1,0).getDate();
    let cells="";for(let k=0;k<dow(first);k++) cells+='<i class="blank"></i>';
    for(let d=1;d<=n;d++){const s=yr+"-"+pad(m+1)+"-"+pad(d);
      if(s>today){cells+='<i class="fut"></i>';continue}
      const {a,d:dn}=dayInfo(s); const tdy=s===today?" tdy":"";
      if(!a){cells+=`<i class="${tdy}" title="${s}"></i>`;continue}
      const f=dn/a, l=f===0?0:f===1?4:f<1/3?1:f<2/3?2:3; if(l===4) perfect++;
      cells+=`<button class="l${l}${tdy}" data-goday="${s}" aria-label="${dayLabel(s)}: ${dn} de ${a}" title="${dayLabel(s)} · ${dn} de ${a}"></button>`}
    html+=`<div class="month"><small>${MO[m].slice(0,3)}</small><div class="mgrid">${cells}</div></div>`}
  $("#months").innerHTML=html; $("#ySub").textContent=perfect+" "+(perfect===1?"día perfecto":"días perfectos");
  $("#rList").innerHTML=habits.length?habits.map(h=>{const s=habitStats(h,logs,today);
    return `<div class="card srow"><b>${esc(h.name)}</b><span class="flame">${FLAME}${s.current} ${dd(s.current)}</span><span>mejor ${s.best}</span></div>`}).join("")
    :'<div class="empty">Cuando tengas hábitos verás aquí la racha de cada uno.</div>';
}

/* --- Estadísticas --- */
function pctRows(s){return `<div class="pcts">${[["Semana",s.week],["Mes",s.month],["Total",s.total]].map(([k,v])=>`<div class="prow"><span>${k}</span><div class="bar"><i style="width:${(v||0)*100}%"></i></div><span class="n">${pctTxt(v)}</span></div>`).join("")}</div>`}
function renderStats(today){
  const g=$("#statGrid");
  if(!habits.length){g.innerHTML='<div class="empty"><b>Sin datos todavía</b>Las rachas, porcentajes y horas aparecen al registrar tu primer día.</div>';return}
  const G=globalStats(habits,logs,today);
  let html=`<div class="card scard global"><h3>Global</h3><div class="sub">Un día cuenta como cumplido si haces todos los hábitos que aplican</div>
    <div class="sgrid"><div><div class="v">${G.current}</div><div class="k">Racha actual</div></div><div><div class="v">${G.best}</div><div class="k">Mejor racha</div></div>
    <div><div class="v">${G.perfect}<small>/${G.days}</small></div><div class="k">Días completos</div></div><div><div class="v">${fmtH(G.hours)}<small> h</small></div><div class="k">Horas</div></div></div>${pctRows(G)}</div>`;
  habits.forEach(h=>{const s=habitStats(h,logs,today);
    html+=`<div class="card scard"><h3>${esc(h.name)}</h3><div class="sub">${daysTxt(h.days)}${h.target?" · objetivo "+fmtH(h.target)+" h":""} · desde el ${parse(s.start).getDate()} de ${MO[parse(s.start).getMonth()]}</div>
    <div class="sgrid"><div><div class="v">${s.current}</div><div class="k">Racha actual</div></div><div><div class="v">${s.best}</div><div class="k">Mejor racha</div></div>
    <div><div class="v">${s.done}<small>/${s.applicable}</small></div><div class="k">Días cumplidos</div></div><div><div class="v">${fmtH(s.hours)}<small> h</small></div><div class="k">Horas</div></div></div>${pctRows(s)}</div>`});
  g.innerHTML=html;
}

/* --- Resumen --- */
function renderResumen(today){
  const [y,m]=ym.split("-").map(Number), from=ym+"-01", to=ym+"-"+pad(new Date(y,m,0).getDate());
  $("#mTitle").textContent=cap(MO[m-1])+" de "+y; $("#mNext").disabled=ym>=today.slice(0,7);
  let days=0,perfect=0,A=0,D=0,H=0;
  for(let s=from;s<=to&&s<=today;s=addDays(s,1)){const {a,d}=dayInfo(s);if(!a)continue;
    if(s===today&&d<a){A+=d;D+=d;continue} days++;A+=a;D+=d;if(d===a)perfect++}
  const rows=habits.map(h=>Object.assign({h},rangeStats(h,from,to,today))).filter(r=>r.a||r.hrs);
  rows.forEach(r=>H+=r.hrs);
  $("#mKpis").innerHTML=`<div class="card kpi"><div class="label">Días cumplidos</div><div class="v">${perfect}<small>de ${days}</small></div></div>
    <div class="card kpi"><div class="label">Cumplimiento</div><div class="v">${A?Math.round(D/A*100):0}<small>%</small></div></div>
    <div class="card kpi" style="grid-column:span 1"><div class="label">Horas</div><div class="v">${fmtH(H)}<small>h</small></div></div>`;
  rows.sort((p,q)=>(q.a?q.d/q.a:0)-(p.a?p.d/p.a:0)||q.d-p.d);
  $("#mRank").innerHTML=rows.length?rows.map(r=>`<div class="card rank"><b>${esc(r.h.name)}${r.hrs?` <span class="muted" style="color:var(--muted);font-weight:400;font-size:12px">· ${fmtH(r.hrs)} h</span>`:""}</b><span>${r.d} de ${r.a}</span></div>`).join("")
    :'<div class="empty">No hay registros en este mes.</div>';
}

/* --- eventos --- */
function go(t){tab=t;document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  ["hoy","habitos","racha","stats","resumen"].forEach(k=>$("#tab-"+k).hidden=k!==tab);window.scrollTo(0,0);render()}
function closeForm(){formOpen=false;editing=null;$("#formBox").innerHTML=""}
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  const today=todayStr(), ds=t.dataset;
  if(ds.tab){go(ds.tab);return}
  if(ds.goday){day=ds.goday;expanded=null;if(tab!=="hoy")go("hoy");else render();return}
  switch(t.id){
    case "dPrev":day=addDays(day,-1);expanded=null;return render();
    case "dNext":if(day<today){day=addDays(day,1);expanded=null;render()}return;
    case "wPrev":wk=addDays(wk,-7);return render();
    case "wNext":wk=addDays(wk,7);return render();
    case "yPrev":yr--;return render();
    case "yNext":yr++;return render();
    case "mPrev":{const [y,m]=ym.split("-").map(Number),d=new Date(y,m-2,1);ym=fmt(d).slice(0,7);return render()}
    case "mNext":{const [y,m]=ym.split("-").map(Number),d=new Date(y,m,1);ym=fmt(d).slice(0,7);return render()}
    case "bExport":return doExport();
    case "bImport":return $("#fileIn").click();
  }
  if(ds.gowk!=null){wk=weekStart(today);render()}
  else if(ds.toggle){setEntry(day,ds.toggle,{done:!isDone(logs,day,ds.toggle)})}
  else if(ds.expand){expanded=expanded===ds.expand?null:ds.expand;render();if(expanded){const i=$("#hrs-"+expanded);i&&i.focus()}}
  else if(ds.add){const id=ds.add,v=+ds.v;setEntry(day,id,{hours:v?Math.min(24,hoursOf(logs,day,id)+v):0})}
  else if(ds.wtoggle){if(ds.date<=today)setEntry(ds.date,ds.wtoggle,{done:!isDone(logs,ds.date,ds.wtoggle)})}
  else if(ds.newhabit!=null){closeForm();formOpen=true;fDays=[0,1,2,3,4,5,6];if(tab!=="habitos")go("habitos");else render()}
  else if(ds.edit){closeForm();const h=habits.find(x=>x.id===ds.edit);editing=h.id;formOpen=true;fDays=[...h.days];render();window.scrollTo({top:0})}
  else if(ds.cancel!=null){closeForm();render()}
  else if(ds.day!=null){const i=+ds.day;fDays=fDays.includes(i)?fDays.filter(x=>x!==i):[...fDays,i].sort();renderForm()}
  else if(ds.q){fDays=ds.q==="all"?[0,1,2,3,4,5,6]:ds.q==="wk"?[0,1,2,3,4]:[5,6];renderForm()}
  else if(ds.del){confirmDel=ds.del;render()}
  else if(ds.delno!=null){confirmDel=null;render()}
  else if(ds.delok){delHabit(ds.delok)}
  else if(ds.formdel){if(ds.armed){delHabit(ds.formdel)}else{ds.armed="1";t.textContent="Toca otra vez para borrar";t.style.background="#d64545";t.style.color="#fff"}}
});
function delHabit(id){habits=habits.filter(h=>h.id!==id);confirmDel=null;if(editing===id)closeForm();render();toast("Hábito borrado");
  if(db) write("habits/"+id,()=>db.doc("habits/"+id).delete())}
document.addEventListener("submit",e=>{
  if(e.target.id!=="hForm") return; e.preventDefault();
  const name=$("#fName").value.trim(), tv=$("#fTarget").value, target=tv===""?null:Math.max(0,Math.min(24,+tv))||null;
  if(!name){$("#fErr").textContent="Escribe un nombre para el hábito.";return}
  if(!fDays.length){$("#fErr").textContent="Elige al menos un día de la semana.";return}
  let h;
  if(editing) h=Object.assign(habits.find(x=>x.id===editing),{name,days:[...fDays],target});
  else{h={id:"h"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,days:[...fDays],target,start:todayStr(),order:Date.now()};habits.push(h)}
  const was=!!editing; closeForm(); render(); toast(was?"Cambios guardados":"Hábito añadido");
  if(db){const data={name:h.name,days:h.days,target:h.target,start:h.start,order:h.order};write("habits/"+h.id,()=>db.doc("habits/"+h.id).set(data))}
});
const hTimers={};
document.addEventListener("input",e=>{
  const id=e.target.dataset.hours; if(id==null) return;
  const d=day, v=Math.max(0,Math.min(24,parseFloat(String(e.target.value).replace(",","."))||0));
  clearTimeout(hTimers[id]); hTimers[id]=setTimeout(()=>{if(hoursOf(logs,d,id)!==v)setEntry(d,id,{hours:v})},700);
});

/* --- exportar / importar --- */
async function doExport(){
  const data=JSON.stringify({app:"habitos",version:1,exportedAt:new Date().toISOString(),habits,logs},null,2);
  const dl=window.claude?await claude.use("downloads"):null;
  if(!dl){toast("Exportar no está disponible en esta vista.");return}
  try{await dl.save({filename:"habitos-"+todayStr()+".json",data});toast("Copia exportada")}catch(e){if(e&&e.code!=="declined"&&e.code!=="cancelled")toast("No se pudo exportar.")}
}
let pending=null;
$("#fileIn").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{const j=JSON.parse(await f.text());
    if(!Array.isArray(j.habits)||!j.logs||typeof j.logs!=="object") throw 0;
    j.habits.forEach(h=>{if(!h.id||!h.name||!Array.isArray(h.days)) throw 0;h.start=h.start||todayStr();h.target=h.target||null;h.order=h.order||0});
    pending=j; const c=$("#impConfirm"); c.hidden=false;
    c.innerHTML=`<span>${j.habits.length} hábitos y ${Object.keys(j.logs).length} días. Reemplaza tus datos actuales.</span><button class="mini warn" id="impOk">Reemplazar</button><button class="mini" id="impNo">Cancelar</button>`;
  }catch(_){toast("El archivo no es una copia válida de este tracker.")}
});
document.addEventListener("click",async e=>{
  if(e.target.id==="impNo"){pending=null;$("#impConfirm").hidden=true}
  if(e.target.id!=="impOk"||!pending) return;
  const j=pending; pending=null; $("#impConfirm").hidden=true;
  const oldH=habits.map(h=>h.id), oldL=Object.keys(logs);
  habits=j.habits.map(h=>({id:h.id,name:h.name,days:h.days,target:h.target,start:h.start,order:h.order})); logs=JSON.parse(JSON.stringify(j.logs)); render();
  if(!db){toast("Importado solo en esta vista");return}
  toast("Importando…");
  try{
    for(const id of oldH) if(!habits.some(h=>h.id===id)) await db.doc("habits/"+id).delete();
    for(const d of oldL) if(!logs[d]) await db.doc("logs/"+d).delete();
    for(const h of habits) await db.doc("habits/"+h.id).set({name:h.name,days:h.days,target:h.target,start:h.start,order:h.order});
    for(const d in logs){await db.doc("logs/"+d).set({date:d,entries:logs[d]});docExists["logs/"+d]=true}
    toast("Copia restaurada");
  }catch(err){console.error(err);toast("La importación falló a medias. Vuelve a intentarlo.");setSync("err")}
});

/* --- arranque --- */
render();
(async()=>{
  db=window.claude?await claude.use("db"):null;
  if(!db){loaded=true;setSync("local");const b=$("#banner");b.hidden=false;
    b.textContent="No hay conexión con el almacenamiento compartido. Abre el enlace con tu sesión de claude.ai iniciada para guardar y sincronizar entre dispositivos.";render();return}
  let gotH=false,gotL=false;
  db.collection("habits").onSnapshot(s=>{
    habits=s.docs.map(d=>Object.assign({id:d.id},d.data())).map(h=>({id:h.id,name:h.name,days:h.days||[],target:h.target||null,start:h.start||todayStr(),order:h.order||0})).sort((a,b)=>a.order-b.order);
    gotH=true;loaded=gotH&&gotL;setSync("ok");safeRender();
  },err=>{setSync("err");console.error(err)});
  db.collection("logs").onSnapshot(s=>{
    const nl={};s.docs.forEach(d=>{const v=d.data();nl[d.id]=(v&&v.entries)||{};docExists["logs/"+d.id]=true});
    for(const k in logs) if(!nl[k]&&!docExists["logs/"+k]) nl[k]=logs[k];
    logs=nl;gotL=true;loaded=gotH&&gotL;safeRender();
  },err=>{setSync("err");console.error(err)});
})();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
})();
</script>
